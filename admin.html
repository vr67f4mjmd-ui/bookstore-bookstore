<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>لوحة التحكم</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--soft:#F4F7FC;--ink:#0B0F19;--muted:#5B6678;--accent:#A1005B;--accent-dark:#7A0045;--line:#E3E8F0;--danger:#b3261e}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Cairo','Tajawal',sans-serif;background:var(--soft);color:var(--ink);line-height:1.7}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:1rem;color:var(--ink)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.wrap{width:min(1000px,94%);margin:0 auto;padding:1.2rem 0 3rem}
.top{display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap;margin-bottom:1.2rem}
.top h1{font-size:1.5rem;font-weight:800}
.top a{color:var(--accent);font-weight:600}
.btn{display:inline-block;padding:.6rem 1.3rem;border-radius:8px;font-weight:700;background:var(--accent);color:#fff;border:1px solid var(--accent)}
.btn:hover{background:var(--accent-dark)}
.btn.ghost{background:#fff;color:var(--accent)}
.btn.danger{background:#fff;color:var(--danger);border-color:var(--danger)}
.btn.sm{padding:.3rem .8rem;font-size:.9rem}
.panel{background:#fff;border:1px solid var(--line);border-radius:12px;padding:1.2rem}
.login{max-width:380px;margin:12vh auto}
.login h1{margin-bottom:1rem}
label{display:block;font-weight:600;margin-bottom:.8rem}
input[type=text],input[type=password],input[type=number],input[type=file],select,textarea{display:block;width:100%;margin-top:.25rem;padding:.6rem .8rem;border:1px solid var(--line);border-radius:8px;background:var(--soft)}
.err{color:var(--danger);font-weight:600;margin-bottom:.8rem}
.tabs{display:flex;gap:.5rem;margin-bottom:1rem}
.tab{padding:.5rem 1.2rem;border-radius:999px;border:1px solid var(--line);background:#fff;font-weight:700}
.tab.active{background:var(--ink);color:#fff;border-color:var(--ink)}
.dot{display:inline-block;min-width:20px;padding:0 6px;margin-inline-start:.4rem;border-radius:10px;background:var(--accent);color:#fff;font-size:.75rem}
.form-grid{display:grid;grid-template-columns:140px 1fr;gap:1.2rem;margin-bottom:1.4rem}
.cover{aspect-ratio:2/3;border-radius:4px 10px 10px 4px;overflow:hidden;background:var(--soft);border:1px solid var(--line);display:grid;place-items:center;color:var(--muted);font-size:.8rem;text-align:center}
.cover img{width:100%;height:100%;object-fit:cover}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:.8rem}
.chk{display:flex;align-items:center;gap:.5rem;font-weight:400}
.chk input{width:auto;margin:0}
.list{display:grid;gap:.7rem}
.item{display:grid;grid-template-columns:54px 1fr auto;gap:.9rem;align-items:center;background:#fff;border:1px solid var(--line);border-radius:10px;padding:.6rem}
.item .cover{border:0}
.item b{display:block}
.item small{color:var(--muted)}
.item .btns{display:flex;gap:.4rem}
.order{background:#fff;border:1px solid var(--line);border-radius:10px;padding:1rem;display:grid;gap:.4rem}
.order.new{border-color:var(--accent);box-shadow:0 0 0 2px rgba(161,0,91,.14)}
.order-head{display:flex;justify-content:space-between;gap:.6rem;flex-wrap:wrap;align-items:center}
.order ul{list-style:none;color:var(--muted)}
.order a{color:var(--accent);font-weight:600}
.order select{width:auto;display:inline-block;margin:0;padding:.3rem .6rem}
.muted{color:var(--muted)}
.toast{position:fixed;bottom:1.2rem;left:50%;transform:translate(-50%,120px);background:var(--ink);color:#fff;padding:.6rem 1.2rem;border-radius:8px;transition:transform .3s;font-weight:600}
.toast.show{transform:translate(-50%,0)}
@media (max-width:560px){.form-grid{grid-template-columns:1fr}.form-grid .cover{width:110px}.item{grid-template-columns:48px 1fr}.item .btns{grid-column:1/-1}}
</style>
</head>
<body>

<div class="wrap login" id="loginView" hidden>
  <div class="panel">
    <h1>دخول المدير</h1>
    <form id="loginForm">
      <label>كلمة المرور<input type="password" name="pw" required autocomplete="current-password"></label>
      <p class="err" id="loginErr" hidden></p>
      <button class="btn" style="width:100%" type="submit">دخول</button>
    </form>
  </div>
</div>

<div class="wrap" id="appView" hidden>
  <div class="top">
    <h1>لوحة التحكم</h1>
    <div><a href="/">عرض المتجر</a> · <button class="btn ghost sm" id="backupBtn">نسخة احتياطية</button> <button class="btn ghost sm" id="logoutBtn">خروج</button></div>
  </div>
  <div class="tabs">
    <button class="tab active" data-tab="books">الكتب</button>
    <button class="tab" data-tab="orders">الطلبات<span class="dot" id="newDot" hidden>0</span></button>
  </div>

  <section id="booksTab">
    <div class="panel" style="margin-bottom:1.2rem">
      <h2 id="formTitle" style="margin-bottom:1rem">إضافة كتاب</h2>
      <form id="bookForm" novalidate>
        <div class="form-grid">
          <div class="cover" id="preview">صورة الغلاف</div>
          <div>
            <label>صورة الغلاف<input type="file" id="imgInput" accept="image/*"></label>
            <label>اسم الكتاب<input type="text" name="title" maxlength="150"></label>
            <label>اسم المؤلف<input type="text" name="author" maxlength="100"></label>
            <div class="row2">
              <label>عدد الصفحات<input type="number" name="pages" min="1" inputmode="numeric"></label>
              <label>السعر (₪)<input type="number" name="price" min="0" step="0.5" inputmode="decimal"></label>
            </div>
            <label>الكمية المتوفرة<input type="number" name="stock" min="0" inputmode="numeric"></label>
            <label>الفئة
              <select name="cat" id="catSelect"></select>
            </label>
            <label>نبذة عن الكتاب<textarea name="desc" rows="4" maxlength="1500"></textarea></label>
            <label class="chk"><input type="checkbox" name="best"> ضمن الأكثر مبيعاً</label>
          </div>
        </div>
        <p class="err" id="formErr" hidden></p>
        <button class="btn" type="submit" id="saveBtn">حفظ الكتاب</button>
        <button class="btn ghost" type="button" id="cancelEdit" hidden>إلغاء التعديل</button>
      </form>
    </div>
    <div class="list" id="bookList"></div>
  </section>

  <section id="ordersTab" hidden>
    <div class="list" id="orderList"></div>
  </section>
</div>

<div class="toast" id="toast" role="status"></div>

<script>
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const STATUS = { new: 'جديد', processing: 'قيد التجهيز', delivered: 'تم التسليم', cancelled: 'ملغي' };
let token = sessionStorage.getItem('admin_token'), books = [], orders = [], editingId = null, newImg = null;

async function api(path, method = 'GET', body) {
  const r = await fetch(path, {
    method,
    headers: { 'Content-Type': 'application/json', ...(token ? { Authorization: 'Bearer ' + token } : {}) },
    body: body ? JSON.stringify(body) : undefined
  });
  const data = await r.json().catch(() => ({}));
  if (r.status === 401 && token) { logout(); throw new Error('انتهت الجلسة. سجّل الدخول مجدداً.'); }
  if (!r.ok) throw new Error(data.error || 'حدث خطأ.');
  return data;
}
let tt;
function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.add('show'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('show'), 2200); }
const showErr = (id, m) => { const e = $(id); e.textContent = m; e.hidden = false; };

/* ----- دخول ----- */
function logout() { token = null; sessionStorage.removeItem('admin_token'); show(); }
function show() {
  $('#loginView').hidden = !!token;
  $('#appView').hidden = !token;
  if (token) refresh();
}
$('#loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  $('#loginErr').hidden = true;
  try {
    const d = await api('/api/login', 'POST', { password: e.target.pw.value });
    token = d.token; sessionStorage.setItem('admin_token', token); e.target.reset(); show();
  } catch (x) { showErr('#loginErr', x.message); }
});
$('#logoutBtn').addEventListener('click', logout);

/* ----- تبويبات ----- */
document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => {
  document.querySelectorAll('.tab').forEach(x => x.classList.toggle('active', x === t));
  $('#booksTab').hidden = t.dataset.tab !== 'books';
  $('#ordersTab').hidden = t.dataset.tab !== 'orders';
  if (t.dataset.tab === 'orders') loadOrders();
}));

async function refresh() { await Promise.all([loadBooks(), loadOrders()]); }

/* ----- الكتب ----- */
async function loadBooks() {
  try { books = await api('/api/books'); } catch (e) { return toast(e.message); }
  $('#bookList').innerHTML = books.length ? [...books].reverse().map(b => `
    <div class="item">
      <div class="cover"><img src="${esc(b.img)}" alt=""></div>
      <div><b>${esc(b.title)}</b><small>${esc(b.author)} · ${esc(b.cat)} · ${b.pages} صفحة · ${b.price} ₪ · الكمية: ${b.stock ?? 0}${b.stock > 0 ? '' : ' <b style="color:#b3261e">(نفذت الكمية)</b>'}${b.best ? ' · الأكثر مبيعاً' : ''}</small></div>
      <div class="btns">
        <button class="btn ghost sm" data-edit="${esc(b.id)}">تعديل</button>
        <button class="btn danger sm" data-del="${esc(b.id)}">حذف</button>
      </div>
    </div>`).join('') : '<p class="muted">لا توجد كتب بعد. أضف أول كتاب من النموذج أعلاه.</p>';
}

function resetForm() {
  editingId = null; newImg = null;
  $('#bookForm').reset();
  $('#preview').textContent = 'صورة الغلاف';
  $('#formTitle').textContent = 'إضافة كتاب';
  $('#saveBtn').textContent = 'حفظ الكتاب';
  $('#cancelEdit').hidden = true;
  $('#formErr').hidden = true;
}

function compress(file) {
  return new Promise((ok, no) => {
    const r = new FileReader();
    r.onerror = no;
    r.onload = () => {
      const im = new Image();
      im.onerror = no;
      im.onload = () => {
        const w = Math.min(700, im.width), h = Math.round(im.height * w / im.width);
        const c = document.createElement('canvas'); c.width = w; c.height = h;
        c.getContext('2d').drawImage(im, 0, 0, w, h);
        ok(c.toDataURL('image/jpeg', 0.82));
      };
      im.src = r.result;
    };
    r.readAsDataURL(file);
  });
}

$('#imgInput').addEventListener('change', async e => {
  const f = e.target.files[0]; newImg = null;
  if (!f) return;
  try { newImg = await compress(f); $('#preview').innerHTML = `<img src="${newImg}" alt="معاينة">`; }
  catch (x) { showErr('#formErr', 'تعذّر قراءة الصورة. اختر صورة JPG أو PNG.'); }
});

$('#bookForm').addEventListener('submit', async e => {
  e.preventDefault();
  const f = e.target; $('#formErr').hidden = true;
  const body = { title: f.title.value, author: f.author.value, pages: f.pages.value, price: f.price.value, cat: f.cat.value, best: f.best.checked, stock: f.stock.value, desc: f.desc.value };
  if (!editingId && !newImg) return showErr('#formErr', 'اختر صورة الغلاف.');
  if (!body.title.trim() || !body.author.trim()) return showErr('#formErr', 'اكتب اسم الكتاب واسم المؤلف.');
  if (!(+body.pages > 0)) return showErr('#formErr', 'اكتب عدد الصفحات.');
  if (body.price === '' || !(+body.price >= 0)) return showErr('#formErr', 'اكتب السعر.');
  if (body.stock === '' || !(+body.stock >= 0)) return showErr('#formErr', 'اكتب الكمية المتوفرة (0 أو أكثر).');
  if (newImg) body.img = newImg;
  $('#saveBtn').disabled = true;
  try {
    if (editingId) await api('/api/books/' + editingId, 'PUT', body); else await api('/api/books', 'POST', body);
    toast(editingId ? 'تم حفظ التعديلات' : 'تمت إضافة الكتاب');
    resetForm(); await loadBooks();
  } catch (x) { showErr('#formErr', x.message); }
  finally { $('#saveBtn').disabled = false; }
});
$('#cancelEdit').addEventListener('click', resetForm);

$('#bookList').addEventListener('click', async e => {
  const ed = e.target.closest('[data-edit]'), del = e.target.closest('[data-del]');
  if (ed) {
    const b = books.find(x => x.id === ed.dataset.edit); if (!b) return;
    editingId = b.id; newImg = null;
    const f = $('#bookForm');
    f.title.value = b.title; f.author.value = b.author; f.pages.value = b.pages; f.price.value = b.price; f.cat.value = b.cat; f.best.checked = b.best; f.stock.value = b.stock ?? 0; f.desc.value = b.desc || '';
    $('#preview').innerHTML = `<img src="${esc(b.img)}" alt="">`;
    $('#formTitle').textContent = 'تعديل كتاب';
    $('#saveBtn').textContent = 'حفظ التعديلات';
    $('#cancelEdit').hidden = false;
    scrollTo({ top: 0, behavior: 'smooth' });
  }
  if (del) {
    const b = books.find(x => x.id === del.dataset.del);
    if (!b || !confirm('حذف «' + b.title + '» نهائياً؟')) return;
    try { await api('/api/books/' + b.id, 'DELETE'); toast('تم الحذف'); if (editingId === b.id) resetForm(); loadBooks(); }
    catch (x) { toast(x.message); }
  }
});

/* ----- الطلبات ----- */
async function loadOrders() {
  try { orders = await api('/api/orders'); } catch (e) { return toast(e.message); }
  const n = orders.filter(o => o.status === 'new').length;
  $('#newDot').hidden = !n; $('#newDot').textContent = n;
  $('#orderList').innerHTML = orders.length ? orders.map(o => `
    <div class="order ${o.status === 'new' ? 'new' : ''}">
      <div class="order-head">
        <b>طلب رقم ${o.no}</b>
        <span class="muted">${new Date(o.createdAt).toLocaleString('ar')}</span>
        <select data-status="${o.no}" aria-label="حالة الطلب">
          ${Object.entries(STATUS).map(([k, v]) => `<option value="${k}" ${k === o.status ? 'selected' : ''}>${v}</option>`).join('')}
        </select>
      </div>
      <div>${esc(o.customer.name)} · <a href="tel:${esc(o.customer.phone)}">${esc(o.customer.phone)}</a></div>
      <div class="muted">${esc(o.customer.address)}</div>
      <ul>${o.items.map(i => `<li>• ${esc(i.title)} × ${i.qty} = ${i.price * i.qty} ₪</li>`).join('')}</ul>
      <div><b>المجموع: ${o.total} ₪</b> · ${o.pay === 'whatsapp' ? 'طلب مع واتساب' : 'دفع عند الاستلام'}</div>
    </div>`).join('') : '<p class="muted">لا توجد طلبات بعد.</p>';
}
$('#orderList').addEventListener('change', async e => {
  const s = e.target.closest('[data-status]'); if (!s) return;
  try { await api('/api/orders/' + s.dataset.status, 'PATCH', { status: s.value }); toast('تم تحديث الحالة'); loadOrders(); }
  catch (x) { toast(x.message); }
});

$('#backupBtn').addEventListener('click', async () => {
  try {
    const d = await api('/api/backup');
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([JSON.stringify(d, null, 1)], { type: 'application/json' }));
    a.download = 'backup-' + new Date().toISOString().slice(0, 10) + '.json';
    a.click(); URL.revokeObjectURL(a.href);
  } catch (x) { toast(x.message); }
});
fetch('/api/config').then(r => r.json()).then(c => {
  $('#catSelect').innerHTML = c.cats.map(x => `<option>${esc(x)}</option>`).join('');
}).catch(() => {});
show();
</script>
</body>
</html>
